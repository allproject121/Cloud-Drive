name: "💡 Suggestion / Improvement"
description: "Tell us what could be better, or what did not work"
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Write what is on your mind in plain words - English, Hindi or Hinglish are all fine.
        **Please note:** do not write passwords, login tokens or the names of private files here - this page is public.
  - type: dropdown
    id: area
    attributes:
      label: "Which part is this about?"
      options:
        - PC app (Windows)
        - Phone app (Android)
        - Web page (browser)
        - Setup / install
        - Documents (README, SETUP)
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Your suggestion"
      description: "What should be changed or added?"
      placeholder: "Example: the phone app should have a button to download a whole folder..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "How would this help? (optional)"
      placeholder: "What is difficult today, and how this would make it easier"
  - type: textarea
    id: problem
    attributes:
      label: "Did something not work? (optional)"
      description: "What you did, what should have happened, and what happened instead. Include the error message if there was one."
  - type: input
    id: device
    attributes:
      label: "PC / phone (optional)"
      placeholder: "Example: Windows 11, 8 GB RAM / Android 14"
